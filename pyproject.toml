[project]
name = "regular-show-ai-creator"
version = "0.1.0"
description = "A playful Regular Show inspired movie maker CLI."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
  { name = "Regular Show Creator", email = "noreply@example.com" }
]

[project.scripts]
regular-show-creator = "regular_show_app.main:run_cli"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
