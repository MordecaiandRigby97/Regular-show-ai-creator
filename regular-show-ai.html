<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Show AI Scene Generator</title>
</head>
<body>
    <h1>Regular Show AI Scene Generator</h1>

    <label for="apiKey">OpenAI API Key:</label>
    <input type="text" id="apiKey" name="apiKey" placeholder="Enter your OpenAI API Key here">
    <p style="color:red;"><strong>Warning:</strong> Never share your API key. This application runs entirely in your browser and your key is not stored, but it's best practice to use this tool locally.</p>
    <br><br>
    <label for="prompt">Scene Prompt:</label>
    <br>
    <textarea id="prompt" name="prompt" rows="10" cols="50"></textarea>
    <br><br>
    <button onclick="generateScript()">Generate Script</button>
    <br><br>
    <h2>Generated Script:</h2>
    <div id="output"></div>

    <script>
        const characters = {
            "Mordecai": "A blue jay, responsible and often the voice of reason, but can be lazy.",
            "Rigby": "A raccoon, impulsive, immature, and often gets into trouble.",
            "Benson": "A gumball machine, the park manager, easily angered by Mordecai and Rigby's antics.",
            "Pops": "A lollipop-shaped man, cheerful, naive, and wealthy.",
            "Skips": "A yeti, immortal and wise, often helps solve problems.",
            "Muscle Man": "A green, muscular man, arrogant and loves to make 'my mom' jokes.",
            "High Five Ghost": "A ghost with a hand on his head, Muscle Man's best friend."
        };

        async function generateScript() {
            const apiKey = document.getElementById('apiKey').value;
            const userPrompt = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');

            if (!apiKey) {
                outputDiv.innerHTML = "Please enter your OpenAI API key.";
                return;
            }

            const characterDescriptions = Object.entries(characters).map(([name, desc]) => `${name}: ${desc}`).join('\\n');

            const fullPrompt = `
You are a script writer for the show 'Regular Show'.
Here are the characters and their descriptions:
${characterDescriptions}

Write a short scene based on the following prompt:
${userPrompt}

The script should be formatted correctly with character names followed by their dialogue.
`;

            outputDiv.innerHTML = "Generating script...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{ role: "user", content: fullPrompt }],
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`OpenAI API error: ${errorData.error.message}`);
                }

                const data = await response.json();
                const script = data.choices[0].message.content.trim();
                outputDiv.innerHTML = `<pre>${script}</pre>`;

            } catch (error) {
                outputDiv.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
